<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Zählerschrank-Planer: Schrank mit Zählerfeld (links) und Verteilerfeld (rechts) -->
  <rect x="4" y="4" width="56" height="56" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="4"/>
  <line x1="32" y1="6" x2="32" y2="58" stroke="#334155" stroke-width="3"/>

  <!-- Zähler mit Display -->
  <rect x="11" y="13" width="15" height="26" rx="2" fill="#334155"/>
  <rect x="14" y="17" width="9" height="5" rx="1" fill="#f59e0b"/>

  <!-- Reiheneinbaugeräte in zwei Reihen -->
  <rect x="38.5" y="13" width="6" height="14" rx="1" fill="#334155"/>
  <rect x="46.5" y="13" width="6" height="14" rx="1" fill="#334155"/>
  <rect x="38.5" y="37" width="6" height="14" rx="1" fill="#334155"/>
  <rect x="46.5" y="37" width="6" height="14" rx="1" fill="#f59e0b"/>
</svg>
